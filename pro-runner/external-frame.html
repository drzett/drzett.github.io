<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="color-scheme" content="dark light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https: http:; script-src 'unsafe-inline'; style-src 'unsafe-inline';"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0c0e}iframe{border:0;display:block;width:100%;height:100%;background:#0b0c0e}</style></head><body><iframe id="external" title="Online website" allow="clipboard-read; clipboard-write; fullscreen; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><script>(()=>{const raw=new URL(location.href).searchParams.get('url');try{const target=new URL(raw);if(!/^https?:$/.test(target.protocol))throw 0;document.getElementById('external').src=target.href}catch{document.body.textContent='Unable to open this website.'}})();</script></body></html>
